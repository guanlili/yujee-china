# CLIP worker：49.232.156.221（speakup 生产同机，观察期部署）。
#   cd ~/yujee-clip && docker compose -f deploy/china/compose.clip.yml --env-file deploy/china/env/clip.env up -d --build
# 纪律：
#   - 观察期只绑 127.0.0.1；agent 落位后改绑 WireGuard IP（并保持安全组不开 8001）。
#   - 单实例、单进程（进程内单飞锁是全机互斥的依据，见 engine inference.py）。
#   - cpus/mem 限额是为了让 speakup 评分负载优先；放大前先看 docker stats 实测。
name: yujee-clip

services:
  clip:
    build:
      context: ../..
      dockerfile: deploy/china/build/clip.Dockerfile
    image: yujee/clip:china
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8001"
    env_file: env/clip.env
    environment:
      PORT: "8001"
      AGENT_ENV: production
      AGENT_PIPELINE_MODE: real
      AGENT_ENABLE_ANALYZE: "false"
      AGENT_ENABLE_CLIP_EMBEDDINGS: "true"
      GROUPING_CLIP_MODEL_NAME: ViT-B-32
      GROUPING_CLIP_PRETRAINED: openai
      # 国内关键项：CLIP 权重本地加载（open_clip 3.x 的 openai tag 走 HF Hub，国内不通）。
      # 路径必须与 clip.Dockerfile COPY 进镜像的位置一致。
      GROUPING_CLIP_MODEL_PATH: /app/models/ViT-B-32.pt
      # 以下槽位本机不消费（photo profile 默认关），占位满足启动校验即可。
      ARK_BASE_URL: https://ark.cn-beijing.volces.com/api/v3
      ARK_VISION_MODEL: doubao-seed-1-6-vision-250815
      DEEPSEEK_BASE_URL: https://ark.cn-beijing.volces.com/api/v3
      DEEPSEEK_MODEL: deepseek-seed-2-0-lite-260428
    mem_limit: 3g
    cpus: 2.5
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      # CLIP 模型惰性加载：首次 /internal 调用会先载入 torch+ViT-B-32（数十秒）。
      start_period: 60s
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }
