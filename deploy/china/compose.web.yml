# web机：152.136.107.117（2C/3.6G）—— web + design-agent + postgres。
#   docker compose -f deploy/china/compose.web.yml --env-file deploy/china/env/web.env up -d --build
# IP 阶段 web 直接 :80 出（无 TLS，仅测试用）；域名阶段改 nginx+certbot 反代。
# design-agent 单机铁律：replicas 永远 1（session 在进程内存）。
name: yujee-web

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: yujee
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: yujee
      # 117 内存紧：给 PG 一个克制的共享缓冲。
      shared_buffers: 192MB
    volumes:
      - pgdata:/var/lib/postgresql/data
    # 只在容器网络内可达，不映射宿主端口。
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yujee -d yujee"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 700m
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }

  design-agent:
    build:
      context: ../..
      dockerfile: packages/design-agent/Dockerfile
    image: yujee/design-agent:china
    restart: unless-stopped
    # 不发布端口：只有 web 容器经容器网络访问。
    environment:
      PORT: "8787"
      NODE_ENV: production
      DESIGN_AGENT_PROVIDER: volcengine
      DESIGN_AGENT_MODEL: deepseek-v4-pro-260425
      # look_at_photos 取图：直接走容器内的 web，不出机器。
      WEB_BASE_URL: http://web:3000
      DESIGN_AGENT_SHARED_SECRET: ${DESIGN_AGENT_SHARED_SECRET}
      AGENT_SHARED_SECRET: ${AGENT_SHARED_SECRET}
      ARK_API_KEY: ${ARK_API_KEY}
    depends_on: []
    mem_limit: 1300m
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }

  web:
    build:
      context: ../..
      dockerfile: deploy/china/build/web.Dockerfile
    image: yujee/web:china
    restart: unless-stopped
    ports:
      - "80:3000"
    env_file: env/web.env
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 900m
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }

volumes:
  pgdata:
