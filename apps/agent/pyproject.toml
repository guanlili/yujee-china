[project]
name = "yujee-agent"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "httpx>=0.27.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.4.0",
  "structlog>=24.1.0",
  "python-multipart>=0.0.9",
  "pillow>=10.0.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  # Required by the @pytest.mark.asyncio tests (test_chapter_chat / test_theme /
  # test_chat_edit_v2 / test_draft_edit / test_inspect_render). It was assumed
  # present in dev envs but never pinned; without it those async tests error on a
  # clean install. Pinned in WP0.4 (#179) so `pytest apps/agent/tests/` is green
  # from a fresh `pip install -e .[dev]`.
  "pytest-asyncio>=0.23.0"
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
