# Yujee Agent — Fly.io deploy config. App name / region adjust as needed.
# Region nrt (Tokyo): low latency to the Volcano Ark API (cn-beijing) the agent
# depends on. hkg is an alternative. Run `fly launch --no-deploy` to create.
app = "yujee-agent"
primary_region = "nrt"

[build]
  # Deploy from repo root so the Dockerfile can COPY apps/agent and
  # packages/contracts/templates:
  #   fly deploy -c apps/agent/fly.toml --dockerfile apps/agent/Dockerfile .

# Non-secret config only. Secrets are set out-of-band and never committed:
#   fly secrets set AGENT_SHARED_SECRET=... ARK_API_KEY=... DEEPSEEK_API_KEY=...
[env]
  PORT = "8001"
  AGENT_ENV = "production"
  AGENT_PIPELINE_MODE = "real"
  WEB_BASE_URL = "https://yujeeai.com"
  ARK_BASE_URL = "https://ark.cn-beijing.volces.com/api/v3"
  ARK_VISION_MODEL = "doubao-seed-1-6-vision-250815"
  # DeepSeek slot points at Volcano Ark doubao in prod (same key as ARK_API_KEY).
  DEEPSEEK_BASE_URL = "https://ark.cn-beijing.volces.com/api/v3"
  DEEPSEEK_MODEL = "doubao-seed-2-0-lite-260428"

[http_service]
  internal_port = 8001
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "3s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
