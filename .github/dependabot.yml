# 依赖自动升级:与 CI 五门 + branch protection 组成闭环 ——
# Dependabot 开 bump PR → 五门验证 → 绿了才合,audit 门保持长期归零。
# 周一一批;minor/patch 分组尽量合成一个 PR 防 PR 洪水;major 单独 PR 人工审
# (next 16 / react 20 这类必须人工判断)。安全披露(critical/high 走
# security-updates 通路)不等周批,即时开 PR。
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # AI SDK 单列:这几个包按 semver 只是 minor,但内部会加枚举成员 / 改类型,
      # 直接破编译(2026-11-24 @google/genai 3.0→3.6 加了四个 FinishReason,
      # mapStopReason 的 never 穷尽检查当场编不过)。混进 18 个包的大批里,
      # 一挂全批停,人工也难定位 —— 单独一组,升级时单独看。
      ai-sdk:
        patterns:
          - "@google/genai"
          - "openai"
          - "@anthropic-ai/sdk"
      npm-minor-and-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "@google/genai"
          - "openai"
          - "@anthropic-ai/sdk"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # 以下走专门迁移批,不让 Dependabot 自动追(0.x minor 即 breaking / 大版本迁移):
      - dependency-name: "zod"                # zod 3→4 breaking,#6/#11 已拒
      - dependency-name: "drizzle-orm"        # 0.36→0.45 迁移批
      - dependency-name: "drizzle-kit"        # 同上
      - dependency-name: "@typescript/native-preview"  # tsgo dev 预发布,按需手动(#10)
      # 16 是大版本迁移(#25),major 队列 —— 但 ignore 只挡 16 及以上:
      # 不写 versions 等于「所有版本都忽略」,连 15.x 的安全补丁也开不出 PR,
      # security update job 会以 all_versions_ignored 直接失败(实测 2026-11-21)。
      - dependency-name: "next"
        versions: [">= 16"]
      - dependency-name: "typescript"          # 7.0 移除 baseUrl(TS5102),Next 15 webpack 别名解析仍依赖它,#89 已回滚,等 Next 适配
      - dependency-name: "postgres"            # 4.0 的 lock 解析破坏 Docker 构建 pi-ai 的 openai 依赖,#88 已回滚,待单独研究
      - dependency-name: "@waffo/pancake-ts"   # 0.27 换了 HTTP 层并新增 productId(PROD_xxx) 客户端校验,测试无法再 mock;waffo 支付未启用,待单独迁移(#121)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
  # 2026-10-26 起:engine 的 Python 依赖此前不在这列,Pillow/certifi 的
  # critical 只告警不开 PR,只能手动追。manifest 在 engine/pyproject.toml,
  # 装依赖走 `pip install .`(Dockerfile),地板钉在 pyproject 即随镜像生效。
  - package-ecosystem: pip
    directory: /engine
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      pip-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
