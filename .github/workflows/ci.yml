# 国内版安全网:push/PR 自动跑全部测试与静态闸门。
# 取代原仓「没有 CI,所有验证靠本地自觉」的状态 —— 重构期的第一道防线。
# 注意 web 门必须先 design:build:style-append-consistency 测试 import
# design-agent 源码,其解析依赖 pi 包的 dist/(README「验证陷阱」有专段)。
name: CI

# 权限最小化(2026-11-04 P0):GITHUB_TOKEN 默认 read/write all 过大;本工作流
# 除 secrets-scan 外全部只需读仓库,deploy 走 SSH secrets 不依赖 token 写权限。
permissions:
  contents: read
  pull-requests: read

on:
  push:
    branches: [main]
  pull_request:
  # Merge queue(2026-11):main 是 strict 保护,每个 PR 合入后其余 PR 立刻 BEHIND,
  # 得手工 rebase + 重跑全量。开队列后 GitHub 自动排队、按序验证、逐个落地。
  # merge_group 事件必须声明,否则队列里的 CI 不触发、队列会卡住。
  # merge_group 的 ref 不是 refs/heads/main,deploy/notify 的
  # `github.ref == 'refs/heads/main'` 判断天然排除它 —— 队列验证不触发部署。
  merge_group:
  # 手动兜底入口。2026-10-25 曾误判「push 不触发 run」——实为 gh CLI 在
  # upstream/origin 并存的仓里默认解析到 upstream 原仓,run list 看错了地方。
  # 本仓 gh 命令务必显式 -R guanlili/yujee-china。
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 生产部署:五门全绿后 SSH 到 49.232 跑 deploy-from-git.sh(ForceCommand 锁死,
  # restricted key 见 deploy/china/README「自动部署」)。只在 push main(即 PR 合并)
  # 触发;concurrency 排队不取消,防两次部署并发打架。
  deploy:
    needs: [audit, typecheck, engine, web, packages, chapters]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # 记录部署历史(不挂审批规则时不影响流程)
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    # 2026-11-04 P0 放宽到 15min:正常部署 48s~4min、冷构建 clip ~5min 可覆盖;
    # 但回滚(P0 自动回滚)需要二次 build+up 重建旧代码,10min 会被掐断,
    # 15min 兜底正常部署 + 回滚重建两段。
    timeout-minutes: 30
    steps:
      - name: Deploy to production
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          install -m 600 /dev/stdin ~/.ssh/id_ed25519 <<< "$DEPLOY_SSH_KEY"
          echo "$DEPLOY_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          set -o pipefail
          ssh -i ~/.ssh/id_ed25519 -o ServerAliveInterval=30 ubuntu@$DEPLOY_HOST deploy | tee /tmp/deploy.out
      # 2026-11-11:ssh deploy 返回 0 不等于新代码上线。2026-11-10 实测过 CI 全绿
      # 而线上仍是旧版(deploy 卡在 in_progress 时页面读到的还是旧文案)。
      #
      # 判据只能是「部署脚本自己报出的版本」:脚本在 reset --hard 之后才打印
      # `now at <short sha> <subject>`,那行出现即代表工作区真的切到了目标提交。
      #
      # 不能用 ssh 去查远端 HEAD —— CI 的 DEPLOY_SSH_KEY 在 authorized_keys 里带
      # 强制命令,任何 ssh 都会再跑一遍部署,并把部署日志塞进 stdout(实测抓到的
      # 「HEAD」其实是日志里的一个 image id)。所以这里只读 deploy 自己留下的输出,
      # 加上一个不依赖 ssh 的外部事实:公网主页 200。
      - name: Verify deployed revision
        timeout-minutes: 5
        run: |
          short="${GITHUB_SHA:0:7}"
          echo "expected short = $short"
          if [ ! -f /tmp/deploy.out ]; then
            echo "::error::部署输出缺失(/tmp/deploy.out 不存在)"
            exit 1
          fi
          echo "--- 部署脚本自报的版本 ---"
          grep -E "deploy start|now at" /tmp/deploy.out || true
          echo "-------------------------"
          if grep -qE "now at ${short} .*\(rollback\)" /tmp/deploy.out; then
            echo "::error::部署走了回滚分支,线上不是本次提交"
            exit 1
          fi
          if ! grep -q "now at ${short}" /tmp/deploy.out; then
            echo "::error::部署脚本没有报出本次提交 ${short},工作区没有切到目标提交"
            exit 1
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' -m 20 https://outman.press/zh)
          echo "public /zh = $code"
          if [ "$code" != "200" ]; then
            echo "::error::线上 https://outman.press/zh 返回 $code"
            exit 1
          fi

      - name: Alert Feishu on deploy failure
        if: failure()
        env:
          WEBHOOK: ${{ secrets.FEISHU_ALERT_WEBHOOK }}
        run: |
          if [ -z "$WEBHOOK" ]; then exit 0; fi
          curl -fsS -m 10 -X POST "$WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{
              \"msg_type\": \"interactive\",
              \"card\": {
                \"header\": {\"title\":{\"tag\":\"plain_text\",\"content\":\"🚨 部署失败 (main)\"}, \"template\": \"red\"},
                \"elements\": [
                  {\"tag\":\"div\",\"text\":{\"tag\":\"lark_md\",\"content\":\"提交: ${GITHUB_SHA::8}\n线上可能仍在跑旧版本,请检查 GitHub Actions 日志\n<at id=all></at>\"}}
                ]
              }
            }" || true

  # 依赖漏洞门:只读 lockfile,秒级完成。2026-10-26 迁移批(drizzle 0.45 / zod 4 /
  # vite 8.1.6 override)清掉全部 high 后,收紧到 --audit-level=high —— 今后新 high
  # 直接红门。advisory 库动态更新,moderate/low 仍放行(靠周批 dependabot 消化)。
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      # advisory 端点必须显式钉官方 registry:npmmirror 镜像没有 audit 端点,不显式指定会
      # ERR_PNPM_AUDIT_ENDPOINT_NOT_EXISTS 静默失效(等于这道门不存在)。
      - run: pnpm audit --prod --audit-level=high --registry=https://registry.npmjs.org/

  # 密钥扫描(全 git 历史):防密钥进仓 —— env 模板多,且历史上有过
  # CRON_SECRET 泄露进会话输出的先例。占位/example 由 .gitleaks.toml 放行。
  secrets-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # gitleaks-action@v3 上传 SARIF 需要 security-events: write,仅此 job 提权。
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  typecheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # docs:check 按提交历史比对 doc-scope 的 checked-at,浅克隆会误报
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # = sitemap:check + contracts/web tsc + pi/design-agent tsc
      # docs:check 已拆成独立 job(见下)—— 它 gate 不了部署
      - run: pnpm typecheck

  # 文档时效闸门,与代码闸门分开跑,也**不进 deploy 的 needs**(2026-11)。
  # 原因:squash 合并后 checked-at 指向的分支提交不在 main 历史里,这个检查
  # 在同一次合并里必然先红一次 —— 必须先合并、才拿到 squash hash,天生两跳。
  # 拿它 gate 部署,红的就是部署本身,而且没人能从"部署失败"看出是文档过期。
  # 它仍然会红:该补 docs PR 时照补,只是不再把代码拦在门外。
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # docs:check 按提交历史比对 doc-scope 的 checked-at,浅克隆会误报
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:check

  engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --extra dev
        working-directory: engine
      - run: PYTHONPATH=engine engine/.venv/bin/python -m pytest engine/tests -q
      # P1 质量闸门(2026-11):ruff 分档起步,select=E9/F821/F841/W 在 engine/src 上 0 违规。
      # mypy 基线 37 错误跨 11 文件,本轮不进 CI;配置已落 pyproject,本地 `mypy src/` 逐步消化。
      - run: engine/.venv/bin/ruff check engine/src

  # web 测试分片(2026-10-29):单 job 7m51s 是全流水线长杆,拆 2 片并行
  # 后 ~4m。分片 = 排序后按行号取模,确定性;admin 独占批只在 shard 1 跑。
  # 聚合:下面的 `web` 空门 job 聚合两片 —— check 名保持 "web" 不变,分支
  # 保护与 deploy 的 needs 都无需改动(聚合 job 改名会牵动 required checks,
  # 而分支保护配置只能网页端改,别绕)。
  web-tests:
    name: web tests (${{ matrix.shard }}/2)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: yujee
          POSTGRES_PASSWORD: yujee
          POSTGRES_DB: yujee
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yujee"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # localhost 命中 db client 的 isLocal 分支,不加 ssl require
      DATABASE_URL: postgres://yujee:yujee@localhost:5432/yujee
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm design:build
      - run: pnpm --filter @yujee/web db:migrate
      - name: web tests (shard ${{ matrix.shard }}/2)
        run: |
          cd apps/web
          FILES=$(git ls-files 'src/**/*.test.ts' 'scripts/**/*.test.ts' | sort | awk -v s='${{ matrix.shard }}' -v n=2 'NR % n == (s-1)')
          echo "本片文件数: $(echo "$FILES" | grep -c .)"
          pnpm exec tsx --test $FILES
      # admin 集成测试对全库状态敏感,常规并行批整文件 skip,此处串行独占跑。
      - name: admin 集成测试(独占,仅 shard 1)
        if: matrix.shard == 1
        run: pnpm --filter @yujee/web test:admin

  # 聚合门:check 名 = "web"(分支保护 required 与 deploy.needs 均认这个名)。
  web:
    needs: [web-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: echo "web 两个分片全部通过"

  packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm design:build
      - run: pnpm --filter @yujee/contracts test
      - run: pnpm --filter @earendil-works/pi-ai test
      - run: pnpm --filter @earendil-works/pi-agent-core test
      - run: pnpm --filter @smalldog/design-agent test

  # 「三个篇章」= apps/web/chapters-source(独立 npm 小站,package name yujee-pet-space)。
  # 产物静态提交在 apps/web/public/chapters,由 next rewrites 映射到 /{locale}/pet|travel|palace。
  # 它不在 pnpm workspace,所以其依赖从来没进 audit 闸门;产物也靠人手复制 => 容易漂移。
  # 这里只在 chapters-source 有改动时真跑:审计 + 测试 + 重建并比对产物(不一致即红)。
  chapters:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: 检测 chapters-source 是否有改动
        id: detect
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          [ -n "$base" ] || base="${{ github.event.before }}"
          case "$base" in ""|0000000000000000000000000000000000000000) base="origin/main" ;; esac
          git rev-parse --verify "$base" >/dev/null 2>&1 || base="origin/main"
          n=$(git diff --name-only "$base" HEAD -- apps/web/chapters-source | wc -l | tr -d ' ')
          echo "changed=$n" >> "$GITHUB_OUTPUT"
          echo "chapters-source 改动文件数: $n"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: steps.detect.outputs.changed != '0'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/chapters-source/package-lock.json
      - name: npm ci
        if: steps.detect.outputs.changed != '0'
        working-directory: apps/web/chapters-source
        run: npm ci
      # 与根 audit 同口径:只审生产依赖、只拦 high(devDeps 的 vite/playwright 噪声大)。
      # registry 必须显式钉官方:npmmirror 没有 audit 端点,不钉会 NOT_IMPLEMENTED 静默失效。
      - name: npm audit (prod, high)
        if: steps.detect.outputs.changed != '0'
        working-directory: apps/web/chapters-source
        run: npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org/
      - name: npm test
        if: steps.detect.outputs.changed != '0'
        working-directory: apps/web/chapters-source
        run: npm test
      # 产物新鲜度闸:重建后覆盖 public/chapters,与仓库里的产物比对;不一致即红。
      - name: 重建并比对产物
        if: steps.detect.outputs.changed != '0'
        working-directory: apps/web/chapters-source
        run: |
          npm run build
          for d in en zh es ja fr pet travel palace; do
            rm -rf "../public/chapters/$d"
            cp -a "dist/$d" "../public/chapters/$d"
          done
          if ! git -C ../.. diff --exit-code -- apps/web/public/chapters; then
            echo "::error::apps/web/public/chapters 与 chapters-source 重建结果不一致 —— 请重新构建并提交产物(README 的复制步骤)"
            exit 1
          fi

  # 2026-10-30:CI 任一门失败或部署失败时发飞书群告警(替代 uptime-kuma push)。
  # 飞书 webhook 存 Secrets(FEISHU_ALERT_WEBHOOK),发交互卡片(红色标题)。
  notify:
    needs: [audit, typecheck, engine, web, packages, chapters]
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Alert Feishu (CI failure)
        env:
          WEBHOOK: ${{ secrets.FEISHU_ALERT_WEBHOOK }}
        run: |
          if [ -z "$WEBHOOK" ]; then exit 0; fi
          curl -fsS -m 10 -X POST "$WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{
              \"msg_type\": \"interactive\",
              \"card\": {
                \"header\": {\"title\":{\"tag\":\"plain_text\",\"content\":\"🚨 CI 失败 (main)\"}, \"template\": \"red\"},
                \"elements\": [
                  {\"tag\":\"div\",\"text\":{\"tag\":\"lark_md\",\"content\":\"提交: ${GITHUB_SHA::8}\n触发: ${{ github.actor }}\n<at id=all></at>\"}}
                ]
              }
            }" || true
