# 国内版安全网:push/PR 自动跑全部测试与静态闸门。
# 取代原仓「没有 CI,所有验证靠本地自觉」的状态 —— 重构期的第一道防线。
# 注意 web 门必须先 design:build:style-append-consistency 测试 import
# design-agent 源码,其解析依赖 pi 包的 dist/(README「验证陷阱」有专段)。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # 手动兜底入口。2026-10-25 曾误判「push 不触发 run」——实为 gh CLI 在
  # upstream/origin 并存的仓里默认解析到 upstream 原仓,run list 看错了地方。
  # 本仓 gh 命令务必显式 -R guanlili/yujee-china。
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 生产部署:五门全绿后 SSH 到 49.232 跑 deploy-from-git.sh(ForceCommand 锁死,
  # restricted key 见 deploy/china/README「自动部署」)。只在 push main(即 PR 合并)
  # 触发;concurrency 排队不取消,防两次部署并发打架。
  deploy:
    needs: [audit, typecheck, engine, web, packages]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    # 2026-10-29 收紧:实测最快 48s、最慢 ~4min(冷构建),10min 足以覆盖
    # 极端情况(clip 全量重建 ~5min);30min 太宽,卡死的部署要等半小时才红。
    timeout-minutes: 10
    steps:
      - name: Deploy to production
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          install -m 600 /dev/stdin ~/.ssh/id_ed25519 <<< "$DEPLOY_SSH_KEY"
          echo "$DEPLOY_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_ed25519 -o ServerAliveInterval=30 ubuntu@$DEPLOY_HOST deploy

  # 依赖漏洞门:只读 lockfile,秒级完成。2026-10-26 迁移批(drizzle 0.45 / zod 4 /
  # vite 8.1.6 override)清掉全部 high 后,收紧到 --audit-level=high —— 今后新 high
  # 直接红门。advisory 库动态更新,moderate/low 仍放行(靠周批 dependabot 消化)。
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - run: pnpm audit --prod --audit-level=high

  # 密钥扫描(全 git 历史):防密钥进仓 —— env 模板多,且历史上有过
  # CRON_SECRET 泄露进会话输出的先例。占位/example 由 .gitleaks.toml 放行。
  secrets-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  typecheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # docs:check 按提交历史比对 doc-scope 的 checked-at,浅克隆会误报
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # = docs:check + sitemap:check + templates:check + contracts/web tsc
      - run: pnpm typecheck

  engine:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --extra dev
        working-directory: engine
      - run: PYTHONPATH=engine engine/.venv/bin/python -m pytest engine/tests -q

  # web 测试分片(2026-10-29):单 job 7m51s 是全流水线长杆,拆 2 片并行
  # 后 ~4m。分片 = 排序后按行号取模,确定性;admin 独占批只在 shard 1 跑。
  # 聚合:下面的 `web` 空门 job 聚合两片 —— check 名保持 "web" 不变,分支
  # 保护与 deploy 的 needs 都无需改动(聚合 job 改名会牵动 required checks,
  # 而分支保护配置只能网页端改,别绕)。
  web-tests:
    name: web tests (${{ matrix.shard }}/2)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: yujee
          POSTGRES_PASSWORD: yujee
          POSTGRES_DB: yujee
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yujee"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # localhost 命中 db client 的 isLocal 分支,不加 ssl require
      DATABASE_URL: postgres://yujee:yujee@localhost:5432/yujee
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm design:build
      - run: pnpm --filter @yujee/web db:migrate
      - name: web tests (shard ${{ matrix.shard }}/2)
        run: |
          cd apps/web
          FILES=$(git ls-files 'src/**/*.test.ts' 'scripts/**/*.test.ts' | sort | awk -v s='${{ matrix.shard }}' -v n=2 'NR % n == (s-1)')
          echo "本片文件数: $(echo "$FILES" | grep -c .)"
          pnpm exec tsx --test $FILES
      # admin 集成测试对全库状态敏感,常规并行批整文件 skip,此处串行独占跑。
      - name: admin 集成测试(独占,仅 shard 1)
        if: matrix.shard == 1
        run: pnpm --filter @yujee/web test:admin

  # 聚合门:check 名 = "web"(分支保护 required 与 deploy.needs 均认这个名)。
  web:
    needs: [web-tests]
    runs-on: ubuntu-24.04
    steps:
      - run: echo "web 两个分片全部通过"

  packages:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm design:build
      - run: pnpm --filter @yujee/contracts test
      - run: pnpm --filter @earendil-works/pi-ai test
      - run: pnpm --filter @earendil-works/pi-agent-core test
      - run: pnpm --filter @smalldog/design-agent test
