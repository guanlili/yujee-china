# 设计 Agent(Fly: yujee-design-agent)自动部署。
#
# 为什么必须自动:它的 Dockerfile 是 `COPY . .`,packages/contracts/templates 被
# 烤进镜像、运行时从磁盘读。所以 contracts 一变、它就必须重新部署,否则线上会出现
# 「一个服务用新模板生产数据、另一个服务用旧模板校验数据」。
#
# 2026-07-25 就是漏了这一步:mag-59 的槽位改动(2d0f870d)比这个服务的部署晚了 2 小时,
# 之后再没部署过。结果任何页面用到 mag-59 的册子,对话改书 100% 失败(422 book 契约
# 不合法),潜伏了 6 天才被用户撞出来。这个 workflow 就是为了让那件事不能再发生。
name: Deploy design-agent (Fly)

on:
  push:
    branches: [main]
    paths:
      - 'packages/design-agent/**'
      - 'packages/contracts/**'
      - '.github/workflows/deploy-design-agent.yml'
  workflow_dispatch:

# 串行:两次部署重叠会让单机服务被来回替换。不取消进行中的那次 —— 部署到一半被
# 掐断比多等一会儿危险。
concurrency:
  group: deploy-design-agent
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # --ha=false 是硬约束,不是优化:每册的 session/trace/书状态在进程内存里,
      # Web 每轮先 POST /api/book 再 POST /api/chat,两个请求必须命中同一台机器。
      # 多开一台就会把编辑会话打散。理由写在 packages/design-agent/fly.toml 注释里。
      #
      # --local-only:runner 自带 Docker,直接本地构建后推 registry.fly.io,
      # 绕开远程 builder / depot(在受限网络下会失败)。
      - name: Deploy
        run: |
          flyctl deploy \
            --config packages/design-agent/fly.toml \
            --dockerfile packages/design-agent/Dockerfile \
            --ha=false \
            --depot=false \
            --local-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_DEPLOY_TOKEN_DESIGN_AGENT }}

      # flyctl deploy 本身会等健康检查通过,不通过就非零退出。这一步是额外确认
      # 对外可达,并把结果留在 job 日志里备查。
      - name: Verify health
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 \
              https://yujee-design-agent.fly.dev/health || echo 000)
            echo "attempt $i: http=$code"
            [ "$code" = "200" ] && exit 0
            sleep 6
          done
          echo "健康探针始终不是 200,部署可能没真正生效"
          exit 1
