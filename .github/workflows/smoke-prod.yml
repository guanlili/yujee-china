# 生产只读冒烟(每天一次 + 可手动触发)。
#
# 为什么单独一个 workflow:它检查的是「线上此刻是否健康」,与当次改动无关。
# 放进 PR 闸门会让线上抖动决定 PR 能否合并;放这里既能每天留一条时间线,
# 也能在发版后手动点一次确认。
#
# 只打 GET/HEAD 与必然被拒的负向请求,不需要任何 secret。
name: Smoke (prod)

on:
  schedule:
    # UTC 16:10 = 北京时间 00:10,避开 04:00 备份与凌晨部署窗口。
    - cron: '10 16 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-prod
  cancel-in-progress: true

jobs:
  prod-readonly:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 线上只读冒烟
        run: pnpm smoke:prod
