[project]
name = "yujee-agent"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.162.0",
  "uvicorn[standard]>=0.54.0",
  "httpx>=0.28.1",
  # certifi 是 httpx 的传递依赖;显式钉地板是因为 2026-10 的 emSign 根证书
  # 撤销事件(GHSA:中介 CA 私钥泄露),2026.10.19 之前的 bundle 带污染根。
  "certifi>=2026.10.23",
  "pydantic>=2.14.2",
  "pydantic-settings>=2.16.2",
  "structlog>=26.1.0",
  "python-multipart>=0.0.33",
  # 13.0.0 之前有 JPEG 解码堆溢出等一批已披露 CVE(<=12.3.0 一档含 critical),
  # engine 直接解码用户上传的照片,必须钉在修复线之上。
  "pillow>=13.0.0",
  "psycopg[binary]>=3.3.7"
]

[project.optional-dependencies]
# 只有专用的 CLIP worker 装(Dockerfile 的 INSTALL_CLIP 段)。普通 1GB Agent 不装 ——
# 照片档案的分割推理和 CLIP embedding 都只在那台机器上跑。
clip = [
  "onnxruntime>=1.31.1",
  "numpy>=2.4.6",
]
dev = [
  # 档案几何组的预处理/后处理要 numpy(推理本身在 clip extra 里)。没有它
  # tests/test_profile_geometry.py 的模型接线用例整组收集不了。
  "numpy>=2.4.6",
  "pytest>=9.2.0",
  # Required by the @pytest.mark.asyncio tests (test_chapter_chat / test_theme /
  # test_chat_edit_v2 / test_draft_edit / test_inspect_render). It was assumed
  # present in dev envs but never pinned; without it those async tests error on a
  # clean install. Pinned in WP0.4 (#179) so `pytest engine/tests/` is green
  # from a fresh `pip install -e .[dev]`.
  "pytest-asyncio>=1.4.1.post1",
  # P1 质量闸门(2026-11):ruff/mypy 静态检查。ruff 先进 CI(0 违规起步档),
  # mypy 基线 37 错误跨 11 文件,本轮仅装到 dev 供本地跑,不进 CI(见 ci.yml 注释)。
  "ruff>=0.17.3",
  "mypy>=2.4.1"
]

[build-system]
requires = ["setuptools>=84.2.1", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# ruff(2026-11 P1):分档起步。选 E9(语法错误)/F821(未定义名)/F841(未用局部变量)/
# W(警告)——实测在 engine/src 上 0 违规。后续批次计划:
#   档2(下一轮):先清 3 个 F401 未用 import,再纳入 F;再清 5 个 BLE001 blind-except 后纳入 B。
#   档3:isort(I)、pyupgrade(UP)、bugbear(B 剩余)逐组清。
# line-length=100 是声明目标(供未来 format 档),当前未选 E501,不会立即报错。
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F821", "F841", "W"]

# mypy(2026-11 P1):宽松起步配置,基线 37 错误跨 11 文件,本轮不进 CI。
# 配置先落地,dev 本地可 `mypy src/` 逐步消化;错误清零后再加进 ci.yml engine job。
[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
# 不开启 strict 家族,避免一次性引爆;先抓最明显的类型错误。
disable_error_code = "annotation-unchecked"
