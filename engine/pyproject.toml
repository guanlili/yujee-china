[project]
name = "yujee-agent"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "httpx>=0.27.0",
  # certifi 是 httpx 的传递依赖;显式钉地板是因为 2026-10 的 emSign 根证书
  # 撤销事件(GHSA:中介 CA 私钥泄露),2026.10.19 之前的 bundle 带污染根。
  "certifi>=2026.10.19",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.16.1",
  "structlog>=24.1.0",
  "python-multipart>=0.0.9",
  # 13.0.0 之前有 JPEG 解码堆溢出等一批已披露 CVE(<=12.3.0 一档含 critical),
  # engine 直接解码用户上传的照片,必须钉在修复线之上。
  "pillow>=13.0.0",
  "psycopg[binary]>=3.2.0"
]

[project.optional-dependencies]
# 只有专用的 CLIP worker 装(Dockerfile 的 INSTALL_CLIP 段)。普通 1GB Agent 不装 ——
# 照片档案的分割推理和 CLIP embedding 都只在那台机器上跑。
clip = [
  "onnxruntime>=1.20.1",
  "numpy>=1.26",
]
dev = [
  # 档案几何组的预处理/后处理要 numpy(推理本身在 clip extra 里)。没有它
  # tests/test_profile_geometry.py 的模型接线用例整组收集不了。
  "numpy>=1.26",
  "pytest>=8.2.0",
  # Required by the @pytest.mark.asyncio tests (test_chapter_chat / test_theme /
  # test_chat_edit_v2 / test_draft_edit / test_inspect_render). It was assumed
  # present in dev envs but never pinned; without it those async tests error on a
  # clean install. Pinned in WP0.4 (#179) so `pytest engine/tests/` is green
  # from a fresh `pip install -e .[dev]`.
  "pytest-asyncio>=0.23.0"
]

[build-system]
requires = ["setuptools>=84.2.1", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
