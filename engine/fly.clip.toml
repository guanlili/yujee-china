# Yujee Agent CLIP embedding worker — deployed separately from the normal Agent app.
app = "yujee-agent-clip"
primary_region = "nrt"

[build]
  # Deploy from repo root with:
  #   fly deploy -c engine/fly.clip.toml --dockerfile engine/Dockerfile --build-arg INSTALL_CLIP=true --depot=false .

[env]
  PORT = "8001"
  AGENT_ENV = "production"
  AGENT_PIPELINE_MODE = "real"
  AGENT_ENABLE_ANALYZE = "false"
  AGENT_ENABLE_CLIP_EMBEDDINGS = "true"
  WEB_BASE_URL = "https://yujeeai.com"
  ARK_BASE_URL = "https://ark.cn-beijing.volces.com/api/v3"
  ARK_VISION_MODEL = "doubao-seed-1-6-vision-250815"
  DEEPSEEK_BASE_URL = "https://ark.cn-beijing.volces.com/api/v3"
  DEEPSEEK_MODEL = "doubao-seed-2-0-lite-260428"
  GROUPING_CLIP_MODEL_NAME = "ViT-B-32"
  GROUPING_CLIP_PRETRAINED = "openai"

[http_service]
  internal_port = 8001
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  # Keep a single MVP CLIP worker; Fly creates a second HA machine when this is 1
  # on first deploy.
  min_machines_running = 0

  [[http_service.checks]]
    interval = "15s"
    timeout = "3s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  # Dedicated open_clip embedding service.
  memory = "2048mb"
